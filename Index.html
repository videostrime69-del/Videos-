<script>
    let db = JSON.parse(localStorage.getItem('sh_local_db')) || [];
    let currentCategory = 'All';
    let searchQuery = '';

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.opacity = '1';
        t.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => {
            t.style.opacity = '0';
            t.style.transform = 'translateX(-50%) translateY(50px)';
        }, 2000);
    }

    function extractId(url) {
        if (!url) return '';
        url = url.trim();
        if (!url.includes('/') && url.length > 20) return url;
        const match = url.match(/(?:\/d\/|id=)([a-zA-Z0-9_-]+)/);
        return match ? match[1] : url;
    }

    function renderHome() {
        const grid = document.getElementById('videoGrid');
        grid.innerHTML = '';

        let filtered = db.filter(v => {
            let matchCat = currentCategory === 'All' || v.category === currentCategory;
            let matchSearch = v.title.toLowerCase().includes(searchQuery.toLowerCase());
            return matchCat && matchSearch;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state"><div>No videos yet</div><div style="font-size: 12px; color: var(--accent);">Logo par 5 vaar click kari ne Admin Login karo</div></div>`;
            return;
        }

        filtered.forEach((vid, index) => {
            let ratioClass = 'ratio-16-9';
            if (vid.ratio === '9:16') ratioClass = 'ratio-9-16';
            else if (vid.ratio === '1:1') ratioClass = 'ratio-1-1';
            else if (vid.ratio === '4:3') ratioClass = 'ratio-4-3';

            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="thumbnail-container ${ratioClass}">
                    <img src="https://drive.google.com/thumbnail?id=${vid.id}&sz=w1000" loading="lazy">
                    <div class="badge">${vid.category}</div>
                    <div class="play-overlay-icon">▶</div>
                </div>
                <div class="video-info">
                    <div class="video-title">${vid.title}</div>
                    <div class="video-desc">${vid.description}</div>
                </div>
            `;
            card.onclick = () => openWatch(vid.id);
            grid.appendChild(card);
        });
    }

    // Categories & Search
    document.querySelectorAll('.chip').forEach(chip => {
        chip.onclick = () => {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentCategory = chip.dataset.cat;
            renderHome();
        };
    });

    document.getElementById('searchInput').oninput = (e) => {
        searchQuery = e.target.value;
        renderHome();
    };

    // Watch Page
    function openWatch(id) {
        const vid = db.find(v => v.id === id);
        if (!vid) return;

        document.getElementById('homeView').style.display = 'none';
        document.getElementById('watchView').style.display = 'block';

        document.getElementById('watchBadge').textContent = vid.category;
        document.getElementById('watchTitle').textContent = vid.title;
        document.getElementById('watchDesc').textContent = vid.description;
        document.getElementById('downloadBtn').href = `https://drive.google.com/uc?export=download&id=${vid.id}`;

        const wrapper = document.getElementById('playerWrapper');
        wrapper.style.paddingTop = vid.ratio === '9:16' ? '177.77%' : (vid.ratio === '1:1' ? '100%' : (vid.ratio === '4:3' ? '75%' : '56.25%'));
        if (vid.ratio === '9:16') {
            wrapper.style.maxWidth = '360px';
            wrapper.style.margin = '0 auto';
        } else {
            wrapper.style.maxWidth = 'none';
            wrapper.style.margin = '0';
        }

        document.getElementById('playerIframe').src = `https://drive.google.com/file/d/${vid.id}/preview`;

        // Related Videos
        const relGrid = document.getElementById('relatedGrid');
        relGrid.innerHTML = '';
        db.filter(v => v.id !== id).forEach(vid => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="thumbnail-container ratio-16-9">
                    <img src="https://drive.google.com/thumbnail?id=${vid.id}&sz=w1000" loading="lazy">
                    <div class="badge">${vid.category}</div>
                </div>
                <div class="video-info"><div class="video-title">${vid.title}</div></div>
            `;
            card.onclick = () => openWatch(vid.id);
            relGrid.appendChild(card);
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('backBtn').onclick = () => {
        document.getElementById('watchView').style.display = 'none';
        document.getElementById('homeView').style.display = 'block';
        document.getElementById('playerIframe').src = '';
    };

    document.getElementById('copyBtn').onclick = () => {
        navigator.clipboard.writeText(window.location.href);
        showToast('Link Copied!');
    };

    // Admin Login Trigger (5 clicks on Logo)
    let logoClicks = 0, logoTimer = null;
    document.getElementById('logoBtn').onclick = () => {
        logoClicks++;
        if (logoClicks === 1) logoTimer = setTimeout(() => logoClicks = 0, 1500);
        if (logoClicks >= 5) {
            clearTimeout(logoTimer);
            logoClicks = 0;
            document.getElementById('loginModal').style.display = 'flex';
        }
    };

    document.getElementById('closeLogin').onclick = () => document.getElementById('loginModal').style.display = 'none';
    document.getElementById('closeAdmin').onclick = () => document.getElementById('adminModal').style.display = 'none';

    document.getElementById('loginBtn').onclick = () => {
        if (document.getElementById('adminUser').value === 'chiku_.3919' && document.getElementById('adminPass').value === 'Chintan@2009') {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('adminModal').style.display = 'flex';
            renderAdminList();
            showToast('Login Successful');
        } else {
            showToast('Wrong Credentials');
        }
    };

    // Add Video
    document.getElementById('addVideoBtn').onclick = () => {
        const id = extractId(document.getElementById('inUrl').value);
        const title = document.getElementById('inTitle').value.trim();
        const desc = document.getElementById('inDesc').value.trim();

        if (!id || !title) return showToast('Enter valid URL and Title');

        db.unshift({
            id: id,
            title: title,
            description: desc,
            category: document.getElementById('inCat').value,
            ratio: document.getElementById('inRatio').value
        });

        localStorage.setItem('sh_local_db', JSON.stringify(db));
        showToast('Video Added!');
        document.getElementById('inUrl').value = '';
        document.getElementById('inTitle').value = '';
        document.getElementById('inDesc').value = '';
        renderHome();
        renderAdminList();
    };

    document.getElementById('clearDbBtn').onclick = () => {
        if (confirm('Delete all videos?')) {
            db = [];
            localStorage.removeItem('sh_local_db');
            renderHome();
            renderAdminList();
            showToast('Database Cleared');
        }
    };

    function renderAdminList() {
        const list = document.getElementById('adminVideoList');
        list.innerHTML = '';
        db.forEach((vid, i) => {
            const item = document.createElement('div');
            item.style.cssText = 'display: flex; align-items: center; justify-content: space-between; background: var(--bg); padding: 8px; border-radius: 6px; font-size: 12px;';
            item.innerHTML = `<span>${vid.title}</span> <button style="background:#fce8e6; color:#c5221f; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Delete</button>`;
            item.querySelector('button').onclick = () => {
                db.splice(i, 1);
                localStorage.setItem('sh_local_db', JSON.stringify(db));
                renderHome();
                renderAdminList();
                showToast('Deleted');
            };
            list.appendChild(item);
        });
    }

    renderHome();
</script>
</body>
</html>
