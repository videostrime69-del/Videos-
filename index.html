<script>
const BLOGGER_FEED_URL='https://streamhub69.blogspot.com/feeds/posts/default?alt=json&max-results=150';
const CORS_PROXY='https://api.allorigins.win/raw?url=';
const LS_KEY='sh_ultimate_db';
let activeDB=[];
function thumbUrl(id){return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;}
function toast(m){let e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3000);}
function saveLocal(){localStorage.setItem(LS_KEY,JSON.stringify(activeDB));}
function loadLocal(){try{const r=localStorage.getItem(LS_KEY); if(r) return JSON.parse(r);}catch{} return [];}
function extractDriveId(inp){if(!inp) return ""; inp=inp.trim(); if(/^[a-zA-Z0-9_-]{25,}$/.test(inp)) return inp; let m=inp.match(/\/d\/([a-zA-Z0-9_-]+)/); if(m) return m[1]; m=inp.match(/[?&]id=([a-zA-Z0-9_-]+)/); if(m) return m[1]; return "";}
function logDebug(m){document.getElementById('debugLog').textContent+=m+'\n'; console.log(m);}

const fDrive=document.getElementById('fDrive'), extractInfo=document.getElementById('extractInfo');
fDrive.addEventListener('input',()=>{const id=extractDriveId(fDrive.value); if(id){extractInfo.style.display='block'; extractInfo.innerHTML=`✅ ID: <b>${id}</b>`;} else {if(fDrive.value.trim()=='') extractInfo.style.display='none'; else {extractInfo.style.display='block'; extractInfo.textContent='❌ Invalid ID';}}});

document.getElementById('addVideoBtn').addEventListener('click',()=>{
  const id=extractDriveId(fDrive.value.trim()); const title=document.getElementById('fTitle').value.trim(), desc=document.getElementById('fDesc').value.trim()||'No description', cat=document.getElementById('fCat').value, ratio=document.getElementById('fRatio').value, down=document.getElementById('fDownload').value.trim();
  if(!id){toast('ID required');return;} if(!title){toast('Title required');return;}
  const obj={id,title,description:desc,category:cat,ratio,downloadUrl:down};
  const idx=activeDB.findIndex(v=>v.id===id); if(idx>=0) activeDB[idx]=obj; else activeDB.unshift(obj);
  saveLocal(); renderManage();
  document.getElementById('snippetArea').value=JSON.stringify(activeDB,null,2);
  toast('✅ Added! Copy JSON'); fDrive.value=''; document.getElementById('fTitle').value=''; document.getElementById('fDesc').value='';
});
document.getElementById('copySnippetBtn').addEventListener('click',async()=>{const t=document.getElementById('snippetArea').value; if(!t) return toast('No JSON'); try{await navigator.clipboard.writeText(t); toast('JSON Copied!');}catch{toast('Manual copy');}});
document.getElementById('clearAllBtn').addEventListener('click',()=>{if(confirm('Clear local?')){localStorage.removeItem(LS_KEY); activeDB=[]; saveLocal(); renderManage(); document.getElementById('snippetArea').value=''; toast('Cleared');}});

function renderManage(){
  const list=document.getElementById('manageList'); list.innerHTML='<h3>Manage ('+activeDB.length+')</h3>'; document.getElementById('snippetArea').value=JSON.stringify(activeDB,null,2);
  if(activeDB.length===0){list.innerHTML+='<div style="color:#b9a899;text-align:center;padding:20px">No videos</div>'; return;}
  activeDB.forEach(v=>{
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:10px;align-items:center;padding:10px;border:1px solid rgba(232,197,111,.16);border-radius:12px;background:rgba(255,255,255,.03);margin-bottom:8px';
    row.innerHTML=`<img src="${thumbUrl(v.id)}" onerror="this.style.display='none'" style="width:64px;height:48px;object-fit:cover;border-radius:6px"><div style="flex:1"><div style="font-weight:700">${v.title}</div><div style="font-size:12px;color:#b9a899">${v.category} • ${v.ratio}</div></div><button class="btn" data-del="${v.id}" style="background:rgba(255,0,0,.2)">Delete</button>`;
    row.querySelector('[data-del]').addEventListener('click',()=>{activeDB=activeDB.filter(x=>x.id!==v.id); saveLocal(); renderManage(); toast('Deleted');});
    list.appendChild(row);
  });
}

function fetchBloggerJSONP(){
  return new Promise((resolve, reject)=>{
    const cbName='blogger_cb_'+Date.now();
    const scriptId=cbName+'_script';
    const timeoutId=setTimeout(()=>{ const s=document.getElementById(scriptId); if(s) s.remove(); if(window[cbName]) delete window[cbName]; reject(new Error('JSONP timeout')); }, 10000);
    window[cbName]=(json)=>{ clearTimeout(timeoutId); const s=document.getElementById(scriptId); if(s) s.remove(); delete window[cbName]; resolve(json); };
    const script=document.createElement('script'); script.id=scriptId; script.src=BLOGGER_FEED_URL.replace('alt=json','alt=json-in-script')+'&callback='+cbName+'&t='+Date.now(); script.onerror=()=>{ clearTimeout(timeoutId); const s=document.getElementById(scriptId); if(s) s.remove(); delete window[cbName]; reject(new Error('JSONP script error')); }; document.body.appendChild(script);
  });
}

async function fetchBloggerDB(){
  const statusEl=document.getElementById('dbStatus');
  try{
    statusEl.textContent='🔄 Fetching...'; document.getElementById('debugLog').textContent=''; logDebug('JSONP try...');
    let data=null;
    try{ data=await fetchBloggerJSONP(); logDebug('JSONP ok entries: '+(data.feed?.entry?.length||0)); }catch(e){ logDebug('JSONP fail: '+e.message); }
    if(!data){ try{ const res=await fetch(BLOGGER_FEED_URL+'&t='+Date.now()); if(res.ok) data=await res.json(); logDebug('Direct ok'); }catch(e){ logDebug('Direct fail'); } }
    if(!data){ try{ const proxyUrl=CORS_PROXY+encodeURIComponent(BLOGGER_FEED_URL+'&t='+Date.now()); const res2=await fetch(proxyUrl); if(res2.ok){ data=JSON.parse(await res2.text()); logDebug('Proxy ok'); } }catch(e){ logDebug('Proxy fail'); } }
    if(!data) throw new Error('All failed');
    const entries=data.feed?.entry||[]; let foundVideos=[];
    for(const entry of entries){
      const title=entry.title?.$t||''; const content=entry.content?.$t||'';
      if(title.toLowerCase().includes('database') || content.includes('"id"')){
        try{
          let clean=content.replace(/<[^>]*>/g,' ').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
          const match=clean.match(/\[\s*\{[\s\S]*?\}\s*\]/);
          if(match){ let parsed=JSON.parse(match[0]); if(Array.isArray(parsed)&&parsed.length>0){foundVideos=parsed; break;} }
          const trimmed=clean.trim(); if(trimmed.startsWith('[')){ let parsed2=JSON.parse(trimmed); if(Array.isArray(parsed2)&&parsed2.length>0){foundVideos=parsed2; break;} }
        }catch(e){}
      }
    }
    if(foundVideos.length>0){
      foundVideos=foundVideos.map(v=>({id:(v.id||'').trim(),title:v.title||'Untitled',description:v.description||'',category:v.category||'Reels',ratio:v.ratio||'16:9',downloadUrl:v.downloadUrl||v.downloadUrl1||''})).filter(v=>v.id);
      activeDB=foundVideos; saveLocal(); statusEl.textContent=`✅ Blogger thi ${foundVideos.length} videos`; renderManage(); return;
    }
    throw new Error('No videos found');
  }catch(err){ logDebug('Error: '+err.message); activeDB=loadLocal(); statusEl.textContent=activeDB.length>0?`⚠️ Blogger fail, Local ${activeDB.length}`:`❌ ${err.message}`; renderManage(); }
}

document.getElementById('testBloggerBtn').addEventListener('click',()=>fetchBloggerDB());

(function init(){ activeDB=loadLocal(); renderManage(); fetchBloggerDB(); })();
</script>
