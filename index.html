<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>STRIMHUB — Gold Cinema</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070504;
  --card:rgba(22,17,14,0.72);
  --card-hover:rgba(32,24,19,0.92);
  --line:rgba(232,197,111,0.14);
  --line-bright:rgba(232,197,111,0.38);
  --gold:#e8c56f;
  --gold-glow:rgba(232,197,111,0.45);
  --txt:#fbf6ee;
  --muted:#b8a898;
  --accent:#e8c56f;
  --accent-warm:#ff6842;
  --radius:22px;
  --max:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:
    radial-gradient(1000px 500px at 15% -5%, rgba(232,197,111,0.14), transparent 50%),
    radial-gradient(850px 420px at 85% 10%, rgba(255,104,66,0.1), transparent 45%),
    radial-gradient(700px 500px at 50% 100%, rgba(232,197,111,0.06), transparent 50%),
    var(--bg);
  color:var(--txt);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
.app{max-width:var(--max);margin:0 auto;padding:0 16px 120px}

.header{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  background:rgba(7,5,4,0.8);
  border-bottom:1px solid var(--line);
  height:68px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin:0 -16px;padding:0 16px;
}
.brand{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'Cormorant Garamond',serif;font-weight:700;
  letter-spacing:.16em;font-size:1.35rem;color:var(--gold);
  background:transparent;border:0;cursor:pointer;
  transition:transform .2s ease;
}
.brand:active{transform:scale(0.96)}
.brand-mark{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,#fce3a0 0%,#c99134 100%);
  color:#1e1307;font-weight:800;font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;
  box-shadow:0 0 16px rgba(232,197,111,0.35);
}
.actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,0.03);border:1px solid var(--line);
  color:var(--gold);display:grid;place-items:center;cursor:pointer;
  backdrop-filter:blur(10px);transition:all .25s ease;
}
.icon-btn:hover{border-color:var(--line-bright);background:var(--card-hover);box-shadow:0 0 14px var(--gold-glow)}
.search-bar{position:relative;flex:1;max-width:270px;display:none;animation:fadeIn .25s ease}
.search-bar.open{display:block}
.search-bar input{
  width:100%;height:42px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,0.04);padding:0 38px 0 16px;color:var(--txt);
  outline:0;font-size:13px;backdrop-filter:blur(12px);
  transition:border-color .2s ease;
}
.search-bar input:focus{border-color:var(--gold)}
.search-bar button{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer}

.ad-wrapper{margin:14px -16px 0;padding:10px 16px;background:rgba(255,255,255,0.02);border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.ad-tag{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ad-box-728{width:100%;max-width:728px;min-height:90px;margin:0 auto;border-radius:14px;background:#0d0907;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}

.hero{padding:20px 2px 8px}
.eyebrow{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.eyebrow::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.2rem,8.5vw,3.2rem);line-height:.95;font-weight:700;letter-spacing:-.01em}

.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none;position:sticky;top:68px;z-index:30;backdrop-filter:blur(20px);background:rgba(7,5,4,0.85)}
.cats::-webkit-scrollbar{display:none}
.pill{
  padding:8px 18px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,0.03);color:var(--muted);font-weight:600;
  font-size:13px;white-space:nowrap;cursor:pointer;transition:all .28s cubic-bezier(0.16,1,0.3,1);
}
.pill:hover{border-color:var(--line-bright);color:#fff;transform:translateY(-1px)}
.pill.active{
  background:linear-gradient(135deg,#f3d48a 0%,#c48a2d 100%);
  color:#1b1106;border-color:transparent;font-weight:700;
  box-shadow:0 6px 20px rgba(232,197,111,0.35);
}

.grid{display:grid;grid-template-columns:1fr;gap:18px;padding-top:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;backdrop-filter:blur(14px);
  box-shadow:0 8px 32px rgba(0,0,0,0.45);
  transition:all .32s cubic-bezier(0.16,1,0.3,1);
}
.card:hover{
  transform:translateY(-5px);border-color:var(--line-bright);
  box-shadow:0 14px 38px rgba(0,0,0,0.6), 0 0 20px rgba(232,197,111,0.22);
}
.card:active{transform:scale(0.98)}
.thumb-box{position:relative;aspect-ratio:16/9;background:#140e0b;overflow:hidden}
.thumb-box img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.card:hover .thumb-box img{transform:scale(1.06)}
.play-ic{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:50px;height:50px;border-radius:50%;
  background:linear-gradient(135deg,rgba(255,255,255,0.96),rgba(247,239,228,0.85));
  color:#1a1208;display:grid;place-items:center;font-size:18px;
  box-shadow:0 6px 24px rgba(0,0,0,0.6);transition:all .25s ease;
}
.card:hover .play-ic{transform:translate(-50%,-50%) scale(1.12);background:#fff;box-shadow:0 8px 28px rgba(232,197,111,0.45)}
.c-badge{
  padding:5px 11px;border-radius:999px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
  background:rgba(8,6,5,0.82);color:#f7efe4;
  border:1px solid rgba(232,197,111,0.25);backdrop-filter:blur(8px);
}
.thumb-box .c-badge{position:absolute;left:10px;top:10px}
.card-info{padding:14px}
.c-title{
  font-family:'Cormorant Garamond',serif;font-weight:700;font-size:18px;
  line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:44px;color:var(--txt);
}
.c-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}

.player-container{
  position:relative;width:100%;padding-bottom:56.25%;background:#000;overflow:hidden;
}
.player-container iframe{
  position:absolute;left:0;top:-56px;width:100%;height:calc(100% + 56px);border:0;
}
.drive-block-overlay{
  position:absolute;right:0;top:0;width:80px;height:80px;
  z-index:10;background:transparent;cursor:default;

.pagination{display:flex;justify-content:center;gap:6px;padding:26px 0;flex-wrap:wrap}
.pagination button{
  min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);

.pagination button.active{
  background:linear-gradient(135deg,#f3d48a 0%,#c48a2d 100%);
  color:#1a1208;border-color:transparent;font-weight:700;
}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<script>

const FIREBASE_DB_URL = 'https://primium-videos-boating-default-rtdb.firebaseio.com/videos.json';

let activeDB = [];
let dbConnected = false;

const CATS = ["All","Reels","Movies","Trending","Clips"];
const ADMIN_USER = 'chiku_.3919', ADMIN_PASS = 'Chintan@2009';

/* 5 SMARTLINKS CONFIG */
const SMARTLINKS = [
  "https://omg10.com/4/11660765",
  "https://omg10.com/4/11660503",
  "https://omg10.com/4/11660507",
  "https://www.profitableratecpmnetwork.com/sy80g2uyp?key=6bbdfc8f9f91543edf488ff159946ca1",
  "https://www.profitableratecpmnetwork.com/xdutpy78e?key=827828d45b7ff1f329afb2ded0cfaaa3"
];

function getRandomSmartlink(){
  return SMARTLINKS[Math.floor(Math.random() * SMARTLINKS.length)];
}

/* Background Smartlink Timer (12-15s delay) */
let smartlinkReady = false;
let smartlinkCooling = false;

function initSmartlinkTimer() {
  const delay = Math.floor(Math.random() * 3000) + 12000;
  setTimeout(() => { smartlinkReady = true; }, delay);
}

document.addEventListener('click', (e) => {
  if (e.target.closest('#adminOverlay') || e.target.closest('#loginOverlay') || e.target.closest('#copyBtn') || e.target.closest('#downBtn')) return;

  if (smartlinkReady && !smartlinkCooling) {
    window.open(getRandomSmartlink(), '_blank');
    smartlinkReady = false;
    smartlinkCooling = true;

    setTimeout(() => {
      smartlinkCooling = false;
      smartlinkReady = true;
    }, 30000);
  }
});
initSmartlinkTimer();

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(()=>{ t.style.display = 'none'; }, 2400);
}

function thumbUrl(id){ return `https://drive.google.com/thumbnail?id=${id}&sz=w800`; }
function previewUrl(id){ return `https://drive.google.com/file/d/${id}/preview`; }
function deepLink(id){ return `${location.origin}${location.pathname}?play=${encodeURIComponent(id)}`; }

function extractDriveId(inp){
  if(!inp) return ""; inp = inp.trim();
  if(/^[a-zA-Z0-9_-]{25,}$/.test(inp)) return inp;
  let m = inp.match(/\/d\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
  m = inp.match(/[?&]id=([a-zA-Z0-9_-]+)/); if(m) return m[1];
  return "";
}

function createCard(v){
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `
    <div class="thumb-box">
      <span class="c-badge">${v.category||'Reels'}</span>
      <img src="${thumbUrl(v.id)}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'400\\' height=\\'225\\'><rect width=\\'100%\\' height=\\'100%\\' fill=\\'%23140e0b\\'/></svg>'">
      <div class="play-ic">▶</div>
    </div>
    <div class="card-info">
      <div class="c-title">${v.title}</div>
      <div class="c-meta"><span>${v.ratio||'16:9'}</span><span>${v.category||''}</span></div>
    </div>`;
  c.onclick = () => {
    window.open(`${location.pathname}?play=${encodeURIComponent(v.id)}`, '_blank');
  };
  return c;
}

function filtered(){
  const q = state.q.toLowerCase();
  return activeDB.filter(v => {
    const okCat = state.cat === "All" || v.category === state.cat;
    const okQ = !q || v.title.toLowerCase().includes(q);
    return okCat && okQ;
  });
}

function renderCats(){
  const bar = document.getElementById('catNav'); bar.innerHTML = '';
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'pill' + (state.cat === c ? ' active' : '');
    b.textContent = c;
    b.onclick = () => { state.cat = c; state.page = 1; renderCats(); renderGrid(); };
    bar.appendChild(b);
  });
}

function renderGrid(){
  const list = filtered();
  const grid = document.getElementById('mainGrid'); grid.innerHTML = '';
  const empty = document.getElementById('emptyState');
  
  if(list.length === 0){
    empty.style.display = 'block';
    document.getElementById('pagBox').innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  const total = Math.max(1, Math.ceil(list.length / state.perPage));
  if(state.page > total) state.page = total;
  const start = (state.page - 1) * state.perPage;
  const slice = list.slice(start, start + state.perPage);

  slice.forEach((v, i) => {
    grid.appendChild(createCard(v));
    // 300x250 ADSTERRA BANNER EVERY 4 VIDEOS
    if((i + 1) % 4 === 0){
      const ad = document.createElement('div');
      ad.className = 'card';
      ad.style.cssText = 'min-height:260px;display:grid;place-items:center;background:#0d0907;border:1px solid var(--line)';
      ad.innerHTML = `
        <div style="text-align:center;padding:10px">
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px">ADVERTISEMENT</div>
          <script>
            atOptions = {
              'key' : 'bd6cd8d9d1635c135fed95fedb960acd',
              'format' : 'iframe',
              'height' : 250,
              'width' : 300,
              'params' : {}
            };
          <\/script>
          <script src="https://www.highrevenueformat.com/bd6cd8d9d1635c135fed95fedb960acd/invoke.js"><\/script>
        </div>`;
      setTimeout(()=>{
        ad.querySelectorAll('script').forEach(old=>{
          const n = document.createElement('script');
          if(old.src) n.src = old.src; else n.textContent = old.textContent;
          old.parentNode.replaceChild(n, old);
        });
      }, 40);
      grid.appendChild(ad);
    }
  });

  const pag = document.getElementById('pagBox'); pag.innerHTML = '';
  for(let i = 1; i <= total; i++){
    const b = document.createElement('button');
    b.textContent = i;
    if(i === state.page) b.className = 'active';
    b.onclick = () => { state.page = i; renderGrid(); window.scrollTo({top:0,behavior:'smooth'}); };
    pag.appendChild(b);
  }
}
  function setPlayerRatio(r){
  const el = document.getElementById('playerRatio');
  if(r === '9:16') el.style.paddingBottom = '177.77%';
  else if(r === '1:1') el.style.paddingBottom = '100%';
  else if(r === '4:3') el.style.paddingBottom = '75%';
  else el.style.paddingBottom = '56.25%';
}

/* 1-TIME SMARTLINK CONTROLLERS */
let copySmartlinkTriggered = false;
let downloadSmartlinkTriggered = false;

function openWatch(id){
  const v = activeDB.find(x => x.id === id); if(!v) return;
  state.playing = v; setPlayerRatio(v.ratio);

  copySmartlinkTriggered = false;
  downloadSmartlinkTriggered = false;

  document.getElementById('homeView').style.display = 'none';
  const wv = document.getElementById('watchView'); wv.style.display = 'block';
  document.getElementById('watchTitle').textContent = v.title;
  document.getElementById('watchBadge').textContent = v.category || 'Reels';

  const loader = document.getElementById('playerLoader'); loader.style.display = 'grid';
  const iframe = document.getElementById('videoIframe');
  iframe.src = previewUrl(v.id);
  iframe.onload = () => { loader.style.display = 'none'; };

  renderRelated();
}

function renderRelated(){
  const grid = document.getElementById('relatedGrid'); grid.innerHTML = '';
  if(!state.playing) return;
  let pool = activeDB.filter(v => v.id !== state.playing.id).sort(()=>0.5-Math.random()).slice(0, state.relatedCount);
  pool.forEach(v => grid.appendChild(createCard(v)));
}

/* BUTTONS: 1ST CLICK SMARTLINK, 2ND CLICK ACTION */
document.getElementById('copyBtn').onclick = async () => {
  if(!state.playing) return;

  if(!copySmartlinkTriggered){
    copySmartlinkTriggered = true;
    window.open(getRandomSmartlink(), '_blank');
  } else {
    await navigator.clipboard.writeText(deepLink(state.playing.id));
    showToast('Link Copied!');
  }
};

document.getElementById('downBtn').onclick = () => {
  if(!state.playing) return;

  if(!downloadSmartlinkTriggered){
    downloadSmartlinkTriggered = true;
    window.open(getRandomSmartlink(), '_blank');
  } else {
    if(state.playing.downloadUrl){
      window.open(state.playing.downloadUrl, '_blank');
    } else {
      showToast('Download link not configured');
    }
  }
};

/* SEARCH & ACTION HANDLERS */
document.getElementById('searchToggle').onclick = () => {
  const b = document.getElementById('searchBar'); b.classList.toggle('open');
  if(b.classList.contains('open')) document.getElementById('searchInput').focus();
};
document.getElementById('searchInput').oninput = (e) => { state.q = e.target.value.trim(); state.page = 1; renderGrid(); };
document.getElementById('clearSearch').onclick = () => { document.getElementById('searchInput').value = ''; state.q = ''; renderGrid(); };
document.getElementById('backBtn').onclick = () => { location.href = location.pathname; };
document.getElementById('moreRelatedBtn').onclick = () => { state.relatedCount += 6; renderRelated(); };
document.getElementById('closeSticky').onclick = () => { document.getElementById('stickyAd').style.display = 'none'; };

/* ADMIN TRIGGER: 5 TAPS */
(function(){
  let clicks = 0, timer = null;
  document.getElementById('brandBtn').onclick = (e) => {
    e.stopPropagation(); clicks++; clearTimeout(timer);
    timer = setTimeout(() => { clicks = 0; }, 1400);
    if(clicks >= 5){ 
      clicks = 0; 
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
      document.getElementById('loginOverlay').style.display = 'flex'; 
    }
  };
})();

/* STRICT MANUAL LOGIN CHECK */
document.getElementById('doLogin').onclick = () => {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  
  if(u === ADMIN_USER && p === ADMIN_PASS){
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('adminOverlay').style.display = 'flex';
    renderAdminManage();
  } else {
    showToast('Incorrect Username or Password');
  }
};

function renderAdminManage(){
  const list = document.getElementById('adminList'); list.innerHTML = '';
  document.getElementById('fbStatus').textContent = dbConnected ? '🟢 Connected' : '🔴 Disconnected';
  document.getElementById('fbCount').textContent = activeDB.length;

  activeDB.forEach(v => {
    const item = document.createElement('div');
    item.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid var(--line);font-size:12px';
    item.innerHTML = `<span><b>${v.title}</b> (${v.category})</span><button data-del="${v.id}" style="padding:4px 10px;border-radius:6px;border:0;background:var(--danger);color:#fff;cursor:pointer">Delete</button>`;
    item.querySelector('[data-del]').onclick = async () => {
      activeDB = activeDB.filter(x => x.id !== v.id);
      await fetch(FIREBASE_DB_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(activeDB)
      });
      renderAdminManage(); renderGrid(); showToast('Deleted permanently from Firebase');
    };
    list.appendChild(item);
  });
}

/* ANTI-OVERWRITE PERMANENT SYNC */
document.getElementById('addFbBtn').onclick = async () => {
  const id = extractDriveId(document.getElementById('fDrive').value);
  const title = document.getElementById('fTitle').value.trim();
  const cat = document.getElementById('fCat').value;
  const ratio = document.getElementById('fRatio').value;
  const down = document.getElementById('fDownload').value.trim();

  if(!id || !title){ showToast('Drive ID and Title required'); return; }

  const obj = {id, title, category:cat, ratio, downloadUrl:down};

  // 1. Fetch live DB first to ensure no video is lost
  try {
    const res = await fetch(FIREBASE_DB_URL + '?t=' + Date.now());
    let currentData = await res.json();
    if (currentData && !Array.isArray(currentData)) {
      currentData = Object.values(currentData);
    }
    activeDB = Array.isArray(currentData) ? currentData.filter(v => v && v.id) : [];
  } catch(e) {}

  // 2. Add new video to top
  activeDB.unshift(obj);

  // 3. Save as complete array directly to Firebase
  try {
    const response = await fetch(FIREBASE_DB_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(activeDB)
    });

    if (!response.ok) throw new Error('Permission denied. Ensure Rules are published!');

    showToast('Saved Permanently to Firebase!');
    document.getElementById('fDrive').value = '';
    document.getElementById('fTitle').value = '';
    document.getElementById('fDownload').value = '';
    renderAdminManage();
    renderGrid();
  } catch(e) {
    alert('Error: ' + e.message);
    showToast('Failed to save to Firebase');
  }
};

/* PERMANENT PERSISTENCE FETCH */
async function fetchFirebaseDB(){
  try {
    const res = await fetch(FIREBASE_DB_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('DB Connection Failed');
    const data = await res.json();
    
    if(data){
      if(Array.isArray(data)){
        activeDB = data.filter(v => v && v.id);
      } else if(typeof data === 'object'){
        activeDB = Object.values(data).filter(v => v && v.id);
      }
      dbConnected = true;
    } else {
      activeDB = [];
      dbConnected = true;
    }
  } catch(e) {
    console.error(e);
    activeDB = [];
    dbConnected = false;
  }

  renderCats();
  renderGrid();
  renderAdminManage();

  const p = new URLSearchParams(location.search).get('play');
  if(p) setTimeout(() => openWatch(p), 200);
}

renderCats();
renderGrid();
fetchFirebaseDB();
</script>
